name: home_of_hymns
description: "Home of Hymns — Timeless Hymns for Every Generation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0
  just_audio: ^0.9.42
  just_audio_windows: ^0.2.3
  file_selector: ^1.0.3
  image: ^4.3.0
  flutter_svg: ^2.0.16
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/data/hymns.json
    - assets/data/yo.json
    - assets/data/tunes.json
    - assets/data/tunes_meta.json
    - assets/images/
    - assets/denoms/
